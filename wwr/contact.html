<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact River Rush Rafting for rafting reservations, questions, and website suggestions. Find our contact information, location, and team.">
    <meta name="author" content="Bright Owusu">
    <title>Contact Us | River Rush Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-oars.png" alt="River Rush Rafting logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page">

        <h1>Contact Us</h1>

        <section class="company-info">
            <h2>River Rush Rafting Company</h2>

            <address>
                123 Main River Street<br>
                Kolob, California<br>
                <a href="tel:+233 5581 939 56">+233 5581 939 56</a><br>
                <a href="mailto:info@whiteriverrafting.com">
                    info@whiteriverrafting.com
                </a>
            </address>
        </section>

        <section class="contact-content">

            <div class="company-map">
                <iframe
                  src="https://maps.google.com/maps?q=Kolob%20Canyons%2C%20Utah&t=&z=10&ie=UTF8&iwloc=&output=embed"
                  title="Map showing the rafting company's general location" loading="lazy"
                  allowfullscreen>
                </iframe>
            </div>

            <form class="contact-form" action="#" method="get">

                <div class="form-item">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your name"
                      required>
                </div>

                <div class="form-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email"
                      required>
                </div>

                <fieldset class="message-purpose">
                    <legend>Message Purpose</legend>

                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-item message-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type your message here..."
                      rows="5" required></textarea>
                </div>

                <div class="newsletter">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Send Message</button>

            </form>
        </section>

        <section class="employee-section">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-profiles">

                <figure>
                    <img src="images/employee1.avif"
                      alt="River Rush Rafting customer service representative">
                    <figcaption>
                        <strong>John Smith</strong>
                        <span>Customer Service Manager</span>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.webp" alt="River Rush Rafting trip guide">
                    <figcaption>
                        <strong>Mary Johnson</strong>
                        <span>Lead Rafting Guide</span>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.avif"
                      alt="River Rush Rafting reservations representative">
                    <figcaption>
                        <strong>David Brown</strong>
                        <span>Reservations Coordinator</span>
                    </figcaption>
                </figure>

            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 River Rush Rafting | Bright Owusu</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
